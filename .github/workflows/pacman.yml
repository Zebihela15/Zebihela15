name: Generate Pacman Contribution Graph

on:
  # Tự động chạy mỗi 24 giờ
  schedule:
    - cron: "0 */24 * * *"
  
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:
  
  # Tự động chạy khi push code lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate Pacman animation SVG
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push file SVG lên nhánh output
      - name: Push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
